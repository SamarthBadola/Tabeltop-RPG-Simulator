version: 2
updates:
  - package-ecosystem: maven
    directory: /app
    schedule:
      interval: weekly
    labels:
      - dependencies
      - java
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
